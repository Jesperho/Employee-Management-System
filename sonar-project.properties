
# must be unique in a given SonarQube Server instance
sonar.projectKey=EMP
sonar.projectName=EMP
sonar.projectVersion=1.0
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# JaCoCo coverage report
sonar.coverage.jacoco.xmlReportPaths=target/jacoco-report/jacoco.xml

# Exclude untestable classes from analysis entirely
sonar.exclusions=\
  **/app/Main.java,\
  **/app/GUIApplication.java,\
  **/view/ViewManager.java,\
  **/dataseeder/DataSeeder.java,\
  **/datasource/MariaDbConnection.java

# Also exclude from coverage metric
sonar.coverage.exclusions=\
  **/app/Main.java,\
  **/app/GUIApplication.java,\
  **/view/ViewManager.java,\
  **/dataseeder/DataSeeder.java,\
  **/datasource/MariaDbConnection.java

  #to run: mvn clean verify sonar:sonar "-Dsonar.token=$env:SONAR_TOKEN"
